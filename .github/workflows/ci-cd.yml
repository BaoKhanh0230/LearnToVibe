name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test VibeLog
    runs-on: ubuntu-latest
    steps:
      - name: Download source code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check JavaScript syntax
        run: node --check src/app.js && node --check src/store.js && node --check src/calendar.js && node --check src/calendar-session.js && node --check src/calendar-ui.js && node --check src/calendar-week.js && node --check src/animations.js && node --check src/design-effects.js && node --check src/icons.js && node --check src/notifications.js && node --check src/form-validation.js && node --check src/dropdowns.js && node --check src/command-palette.js && node --check scripts/server.mjs && node --check scripts/google-auth.mjs && node --check scripts/session-store.mjs

      - name: Install dependencies
        run: npm ci

      - name: Check PostgreSQL integration syntax
        run: node --check scripts/postgres-session-store.mjs && node --check scripts/user-data.mjs && node --check scripts/setup-user-data.mjs && node --check src/account.js && node --check src/account-menu.js && node --check src/profile.js && node --check src/profile-sync.js && node --check src/user-storage.js && node --check scripts/calendar-validation.mjs && node --check scripts/verify-cloud-sessions.mjs && node --check scripts/verify-deployment.mjs

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run automated tests
        run: npm test

      - name: Check Pages integration syntax
        run: node --check src/google-config.js && node --check src/calendar-deployment.js && node --check scripts/build-pages.mjs

      - name: Check Vercel integration syntax
        run: node --check api/index.js && node --check scripts/build-vercel.mjs

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && vars.ENABLE_PAGES == 'true'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Download source code
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static website
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: node scripts/build-pages.mjs

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

