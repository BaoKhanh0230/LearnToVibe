name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test VibeLog
    runs-on: ubuntu-latest
    steps:
      - name: Download source code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check JavaScript syntax
        run: node --check src/app.js && node --check src/store.js && node --check src/animations.js && node --check scripts/server.mjs

      - name: Run automated tests
        run: npm test

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && vars.ENABLE_PAGES == 'true'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Download source code
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static website
        shell: bash
        run: |
          mkdir -p _site/src _site/image
          cp index.html styles.css _site/
          cp -R src/. _site/src/
          cp -R image/. _site/image/
          touch _site/.nojekyll

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

